{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Steam Clone{% endblock %}</title>
    <style>
        body {
            background: #1b2838;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header img {
            width: 120px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .content {
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Вход</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="register-link">
            <p>Есть аккаунта? <a href="{% url 'login' %}">Зарегистрироваться</a></p>
        </div>
    </div>
</body>
</html>

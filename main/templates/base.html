{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Steam Clone{% endblock %}</title>
    <style>
        body {
            background: #1b2838;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        header img {
            width: 120px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a,
        .nav-links button {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            background-color: #66c0f4;
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links button:hover {
            background-color: #4da8d8;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<header>
    <div class="nav-links">
        <a href="{% url 'index' %}">Главная</a>
        {% if user.is_authenticated %}
            <a href="{% url 'add_user_game' %}">Добавить игру</a>
            <a href="{% url 'game_request' %}">Запрос игры</a>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Зарегистрироваться</a>
        {% endif %}
    </div>
    <img src="{% static 'main/images/logo.png' %}" alt="Steam Logo">
</header>
<div class="content">
    {% block content %}{% endblock %}
</div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Steam Clone{% endblock %}</title>
    <style>
        body {
            background: #1b2838;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .top-panel a,
        .top-panel button {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
            background-color: #66c0f4;
            padding: 12px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        .top-panel a:hover,
        .top-panel button:hover {
            background-color: #4da8d8;
        }

        .content {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="top-panel">
    <a href="{% url 'index' %}">Главная</a>
    {% if user.is_authenticated %}
        <a href="{% url 'game_request' %}">Запрос игры</a>
        <a href="{% url 'game_requests_status' %}">Статусы заявок</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Выйти</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Войти</a>
        <a href="{% url 'register' %}">Зарегистрироваться</a>
    {% endif %}
</div>
<div class="content">
    {% block content %}{% endblock %}
</div>
</body>
</html>

{% extends 'base.html' %}

{% block title %}Добавить игру{% endblock %}

{% block content %}
<h2>Добавить свою игру</h2>
<form method="post" enctype="multipart/form-data" style="display:block; max-width:700px; margin:0 auto;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить игру</button>
</form>
{% endblock %}

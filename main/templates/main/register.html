
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            background: #1b2838;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #16202d;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input[type="text"], input[type="password"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f9f9f9;
            color: #000;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #66c0f4;
            box-shadow: 0 0 5px rgba(102, 192, 244, 0.8);
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #66c0f4;
            color: #000;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4da8d8;
        }

        .register-link {
            text-align: center;
            margin-top: 10px;
        }

        .register-link a {
            color: #66c0f4;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

{% extends 'base.html' %}

{% block content %}
<div class="register-container">
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
{% load static %}

{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Steam Clone{% endblock %}</title>
    <style>
        body {
            background: #1b2838;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            position: absolute;
            top: 10px;
            left: 10px; /* Перемещаем в левый верхний угол */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header img {
            width: 120px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            background-color: #66c0f4;
            padding: 8px 12px;
            border-radius: 4px;
        }

        header a:hover {
            text-decoration: none;
            background-color: #4da8d8;
        }

        .content {
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'register' %}">Зарегистрироваться</a>
        <img src="{% static 'main/images/logo.png' %}" alt="Steam Logo">
    </header>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
